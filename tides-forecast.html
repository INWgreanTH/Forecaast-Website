// ── Helpers ──────────────────────────────────────────────────────
const MONTHS_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DAYS_IN   = [31,28,31,30,31,30,31,31,30,31,30,31];
const DAY_TH    = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const JAN1_DOW  = 4; // Jan 1 2026 = Thursday

function flatInfo(flat) {
  let rem = flat, m = 0;
  while (rem >= DAYS_IN[m]) { rem -= DAYS_IN[m]; m++; }
  return {
    label: `${rem + 1} ${MONTHS_TH[m]}`,
    dow: DAY_TH[(JAN1_DOW + flat) % 7],
  };
}

// ── วันนี้ (คำนวณอัตโนมัติจากวันที่จริง) ─────────────────────────
const _now  = new Date();
const _y2026 = new Date(2026, 0, 1);
const TODAY_FLAT = _now.getFullYear() === 2026
  ? Math.max(0, Math.min(Math.floor((_now - _y2026) / 86400000), 364))
  : 158; // นอกปี 2569 ใช้ค่า demo

// ── ดึงค่ารายชั่วโมง: ใช้ข้อมูลจริงถ้ามี ไม่งั้น sine fallback ────
// Phase ref: Jun 8 (flat=158) HIGH อยู่ที่ ~11:00, เลื่อน 50 นาที/วัน
const PHASE_REF_FLAT = 158;
const PHASE_REF_HOUR = 11;
function getHourly(flat) {
  if (HOURLY[flat]) return HOURLY[flat];
  let rem = flat, m = 0;
  while (rem >= DAYS_IN[m]) { rem -= DAYS_IN[m]; m++; }
  const hi   = (HIGH[m] && HIGH[m][rem]) ?? 2.0;
  const lo   = (LOW[m]  && LOW[m][rem])  ?? 1.0;
  const mean = (hi + lo) / 2;
  const amp  = (hi - lo) / 2;
  const tPeak = ((PHASE_REF_HOUR + (flat - PHASE_REF_FLAT) * (50/60)) % 24 + 24) % 24;
  return Array.from({length: 24}, (_, h) =>
    parseFloat((mean + amp * Math.cos(2 * Math.PI * (h - tPeak) / 24)).toFixed(2))
  );
}

// ── Plugins ──────────────────────────────────────────────────────
// Day separator: faint vertical at midnight of each new day
const daySepPlugin = {
  id: 'daySep',
  afterDraw(chart) {
    if (!chart._numDays) return;
    const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    for (let d = 1; d < chart._numDays; d++) {
      const xp = x.getPixelForValue(d * 24);
      ctx.beginPath(); ctx.moveTo(xp, top); ctx.lineTo(xp, bottom); ctx.stroke();
    }
    ctx.restore();
  }
};

// Peak dot + value label at each daily HIGH and LOW
const peakPlugin = {
  id: 'peakLabels',
  afterDatasetsDraw(chart) {
    if (!chart._peaks) return;
    const { ctx, scales: { y } } = chart;
    const meta = chart.getDatasetMeta(0);
    ctx.save();
    chart._peaks.forEach(({ idx, isHigh }) => {
      const pt  = meta.data[idx];
      if (!pt) return;
      const val = chart.data.datasets[0].data[idx];
      const xp  = pt.x;
      const yp  = y.getPixelForValue(val);
      // dot
      ctx.beginPath();
      ctx.arc(xp, yp, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = isHigh ? '#00d2ff' : '#00c877';
      ctx.fill();
      // label
      ctx.font         = 'bold 9.5px Segoe UI';
      ctx.fillStyle    = isHigh ? '#00d2ff' : '#00c877';
      ctx.textAlign    = 'center';
      ctx.textBaseline = isHigh ? 'bottom' : 'top';
      ctx.fillText(val.toFixed(1), xp, yp + (isHigh ? -5 : 5));
    });
    ctx.restore();
  }
};

// ── Render ────────────────────────────────────────────────────────
let chartInst = null;

function setDays(n, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(n);
}

function render(numDays) {
  const yData  = [];
  const labels = [];
  const peaks  = [];
  const showTime = numDays <= 7;

  for (let d = 0; d < numDays; d++) {
    const flat = TODAY_FLAT + d;
    if (flat > 364) break; // ไม่เกินสิ้นปี
    const info = flatInfo(flat);
    const hrs  = getHourly(flat); // exact data or sine fallback

    // find peak (high) and trough (low) indices within this day
    let hiIdx = 0, loIdx = 0;
    for (let h = 1; h < 24; h++) {
      if (hrs[h] > hrs[hiIdx]) hiIdx = h;
      if (hrs[h] < hrs[loIdx]) loIdx = h;
    }
    peaks.push({ idx: d * 24 + hiIdx, isHigh: true  });
    peaks.push({ idx: d * 24 + loIdx, isHigh: false });

    hrs.forEach((v, h) => {
      yData.push(v);
      if (h === 0) {
        labels.push([info.dow + '.', info.label]);
      } else if (showTime && (h === 6 || h === 12 || h === 18)) {
        labels.push(`${String(h).padStart(2,'0')}:00`);
      } else {
        labels.push('');
      }
    });
  }

  const totalPts = yData.length;

  // Gradient fill
  function makeGrad(context) {
    const { ctx, chartArea } = context.chart;
    if (!chartArea) return 'rgba(0,150,200,0.2)';
    const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
    g.addColorStop(0,   'rgba(0,180,240,0.40)');
    g.addColorStop(0.65,'rgba(0,180,240,0.07)');
    g.addColorStop(1,   'rgba(0,180,240,0.01)');
    return g;
  }

  if (chartInst) chartInst.destroy();

  const ctx = document.getElementById('chart').getContext('2d');
  chartInst = new Chart(ctx, {
    type: 'line',
    plugins: [daySepPlugin, peakPlugin],
    data: {
      labels,
      datasets: [
        {
          label: 'ระดับน้ำ (ม.)',
          data: yData,
          borderColor: 'rgba(0,210,255,0.9)',
          borderWidth: 2,
          backgroundColor: makeGrad,
          fill: 'origin',
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#fff',
        },
        {
          label: 'วิกฤต 2.5 ม.',
          data: new Array(totalPts).fill(2.5),
          borderColor: 'rgba(255,55,55,0.55)',
          borderWidth: 1.5,
          borderDash: [6, 5],
          pointRadius: 0,
          fill: false,
          tension: 0,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: window.innerWidth < 500
        ? Math.max(1.2, numDays * 0.22)
        : Math.max(2.0, numDays * 0.24),
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: { color: '#555', font: { size: 10 }, boxWidth: 18, padding: 10 }
        },
        tooltip: {
          backgroundColor: 'rgba(5,5,10,0.95)',
          titleColor: '#00d2ff',
          bodyColor: '#bbb',
          borderColor: '#1e1e1e',
          borderWidth: 1,
          padding: 9,
          callbacks: {
            title: items => {
              const idx  = items[0].dataIndex;
              const d    = Math.floor(idx / 24);
              const h    = idx % 24;
              const info = flatInfo(TODAY_FLAT + d);
              return `${info.dow}. ${info.label}  ${String(h).padStart(2,'0')}:00 น.`;
            },
            label: item => {
              if (item.datasetIndex !== 0) return null;
              const v    = item.parsed.y;
              const warn = v >= 2.5 ? ' ⚠️ เฝ้าระวัง'
                         : v >= 2.2 ? ' ⚡ ค่อนข้างสูง'
                         : v <= 0.6 ? ' 🔵 น้ำลงต่ำ'
                         : ' ✅ ปกติ';
              return ` ระดับน้ำ: ${v.toFixed(2)} ม.${warn}`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: {
            autoSkip: false,
            maxRotation: 0,
            color: ctx => Array.isArray(labels[ctx.index]) ? '#ccc' : '#3a3a3a',
            font:  ctx => Array.isArray(labels[ctx.index])
              ? { size: 10, weight: '600' }
              : { size:  9, weight: '400' },
            callback: (_, idx) => labels[idx] ?? '',
          },
          grid: { color: 'rgba(255,255,255,0.025)' }
        },
        y: {
          min: 0,
          max: 3.0,
          ticks: {
            color: '#555',
            font: { size: 10 },
            stepSize: 0.5,
            callback: v => `${v.toFixed(1)} ม.`,
          },
          grid: {
            color: ctx => ctx.tick.value === 2.5
              ? 'rgba(255,55,55,0.2)'
              : 'rgba(255,255,255,0.05)',
          }
        }
      }
    }
  });

  chartInst._numDays = numDays;
  chartInst._peaks   = peaks;
}

render(5);
</script>
</body>
</html>
